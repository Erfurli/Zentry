<div class="dashboard">
  <div class="dashboard-container">
    <header class="dashboard-header">
      <div class="logo">Z</div>
      <div class="welcome-section">
        <h1>¡Hola, {{ summary.userName }}!</h1>
        <p>Resumen de tu jornada laboral</p>
      </div>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Vacaciones pendientes</div>
        <div class="stat-value">
          {{ summary.vacationBalance }}<span class="stat-unit"> días</span>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Horas trabajadas hoy</div>
        <div class="stat-value">
          {{ summary.todayHours }}<span class="stat-unit"> h</span>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Próximas vacaciones</div>
        <div class="stat-value">
          {{ summary.upcomingVacations.length ? summary.upcomingVacations[0].dates : 'Ninguna' }}
        </div>
      </div>
    </div>

    <section class="actions-section">
      <h3 class="actions-title">
        <i class="fa-solid fa-bolt"></i> Acciones rápidas
      </h3>

      <div class="actions-grid">
        <button class="action-btn primary-btn" type="button" (click)="fichar('entrada')">
          <i class="fa-solid fa-door-open"></i> Fichar Entrada
        </button>

        <button class="action-btn primary-btn" type="button" (click)="fichar('salida')">
          <i class="fa-solid fa-door-closed"></i> Fichar Salida
        </button>

        <button class="action-btn primary-btn" type="button" (click)="solicitar('vacaciones')">
          <i class="fa-solid fa-umbrella-beach"></i> Solicitar Vacaciones
        </button>

        <button class="action-btn primary-btn" type="button" (click)="solicitar('ausencia')">
          <i class="fa-solid fa-calendar-xmark"></i> Solicitar Ausencia
        </button>
      </div>


    </section>
<!-- <img
  src="/assets/img/imagen_2026-04-30_201525425-removebg-preview.png"
  alt="Imagen dashboard"
/> -->
  </div>
</div>
