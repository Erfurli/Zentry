<div class="page-container">
  <!-- HEADER PÁGINA -->
  <div class="page-header">
    <div class="header-content">
      <h1>Asistencia Empleados</h1>
      <div class="breadcrumbs">
        <span>Dashboard</span> / <strong>Asistencia</strong>
      </div>
    </div>

    <!-- FILTROS -->
    <div class="filters">
      <select class="filter-select">
        <option>Todos los departamentos</option>
        <option>RRHH</option>
        <option>IT</option>
      </select>
      <input type="date" class="filter-date">
      <button class="filter-btn">Buscar</button>
      <button class="export-btn">
        <i class="fa-solid fa-download"></i> Exportar
      </button>
    </div>
  </div>

  <!-- KPIS -->
  <div class="kpi-grid">
    <div class="kpi-card presente">
      <div class="kpi-number">150</div>
      <div class="kpi-label">Presentes</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-number">125</div>
      <div class="kpi-label">Total Empleados</div>
    </div>
    <div class="kpi-card retraso">
      <div class="kpi-number">15</div>
      <div class="kpi-label">Retrasos</div>
    </div>
    <div class="kpi-card ausente">
      <div class="kpi-number">5</div>
      <div class="kpi-label">Ausentes</div>
    </div>
  </div>

  <!-- TABLA -->
  <div class="table-container">
    <table class="asistencia-table">
      <thead>
        <tr>
          <th>Empleado</th>
          <th>Departamento</th>
          <th>Estado</th>
          <th>Entrada</th>
          <th>Salida</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let empleado of empleados">
          <td>{{ empleado.nombre }}</td>
          <td>{{ empleado.departamento }}</td>
          <td>
            <span class="estado-badge" [ngClass]="empleado.estado.toLowerCase()">
              {{ empleado.estado }}
            </span>
          </td>
          <td>{{ empleado.entrada }}</td>
          <td>{{ empleado.salida }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
