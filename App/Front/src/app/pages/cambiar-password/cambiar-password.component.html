<div class="login-page">
  <div class="login-card">
    <div class="card-icon">
      <i class="fa-solid fa-lock"></i>
    </div>
    <h1>Cambiar contraseña</h1>
    <p>Por seguridad, debes establecer una nueva contraseña antes de continuar.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="nuevaPassword">Nueva contraseña</label>
        <div class="password-wrapper">
          <input
            id="nuevaPassword"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="nuevaPassword"
            placeholder="Mínimo 8 caracteres"
          />
          <button type="button" class="eye-btn" (click)="showPassword.set(!showPassword())">
            <i [class]="showPassword() ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
          </button>
        </div>
        @if (form.controls.nuevaPassword.touched && form.controls.nuevaPassword.invalid) {
          <small class="error-text">Mínimo 8 caracteres.</small>
        }
      </div>

      <div class="form-field">
        <label for="confirmarPassword">Confirmar contraseña</label>
        <div class="password-wrapper">
          <input
            id="confirmarPassword"
            [type]="showConfirm() ? 'text' : 'password'"
            formControlName="confirmarPassword"
            placeholder="Repite la contraseña"
          />
          <button type="button" class="eye-btn" (click)="showConfirm.set(!showConfirm())">
            <i [class]="showConfirm() ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
          </button>
        </div>
        @if (passwordsNoCoinciden) {
          <small class="error-text">Las contraseñas no coinciden.</small>
        }
      </div>

      @if (error) {
        <div class="error-box">{{ error }}</div>
      }

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Guardando...' : 'Establecer contraseña' }}
      </button>
    </form>
  </div>
</div>
