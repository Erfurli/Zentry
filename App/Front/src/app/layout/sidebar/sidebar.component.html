<aside class="sidebar">
  <button
    class="toggle-btn"
    (click)="toggle()"
    [attr.aria-label]="collapsed() ? 'Expandir menú' : 'Colapsar menú'"
    [attr.aria-expanded]="!collapsed()">
    <i
      class="fa-solid"
      [class.fa-chevron-left]="!collapsed()"
      [class.fa-chevron-right]="collapsed()"
      aria-hidden="true">
    </i>
  </button>

  <nav class="sidebar-nav" aria-label="Menú principal">
    <a
      *ngFor="let item of visibleMenuItems"
      [routerLink]="item.route"
      routerLinkActive="active"
      class="nav-item"
      [attr.title]="collapsed() ? item.label : null">
      <i class="fa-solid" [class]="getIconClass(item.route)" aria-hidden="true"></i>
      @if (!collapsed()) { <span>{{ item.label }}</span> }
    </a>
  </nav>
</aside>
