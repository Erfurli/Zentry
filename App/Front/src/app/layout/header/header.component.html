<div class="header">
  <div class="header-left">
    <div class="logo">
      <span class="logo-icon">Z</span>
      <span class="logo-text">Zentry</span>
    </div>
  </div>

  <div class="header-right">
    <app-notificaciones class="icon-btn"></app-notificaciones>

    <button class="icon-btn" type="button" aria-label="Configuración">
      <i class="fa-solid fa-gear" aria-hidden="true"></i>
    </button>

    <button class="icon-btn" type="button" (click)="logout()" aria-label="Cerrar sesión">
      <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
    </button>

    <div class="user-menu">
      <div class="user-info">
        <span class="user-name">{{ username }}</span>
        <span class="user-role">{{ systemRole }} | {{ companyRole }}</span>
      </div>
    </div>
  </div>
</div>
